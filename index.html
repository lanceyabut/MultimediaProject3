<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Reef AR</title>

  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <style>
    body { background:#00121f; color:white; text-align:center; font-family:sans-serif; }
    model-viewer { width:100%; height:400px; margin-top:20px; }
    button { padding:10px 20px; border:none; border-radius:20px; margin:10px; font-weight:bold; }
  </style>
</head>

<body>
  <h2>ReefRevive AR</h2>

  <!-- Coral 1 -->
  <model-viewer id="coral1"
    src="pocillopora_verrucosa.glb"
    ios-src="coral1.usdz"
    alt="Coral Model 1"
    ar
    ar-modes="webxr scene-viewer quick-look"
    camera-controls
    auto-rotate
    environment-image="https://modelviewer.dev/shared-assets/environments/underwater.hdr">
  </model-viewer>

  <!-- Coral 2 -->
  <model-viewer id="coral2" style="display:none"
    src="acropora_valenciennesi.glb"
    ios-src="coral2.usdz"
    alt="Coral Model 2"
    ar
    ar-modes="webxr scene-viewer quick-look"
    camera-controls
    auto-rotate
    environment-image="https://modelviewer.dev/shared-assets/environments/underwater.hdr">
  </model-viewer>

  <button onclick="showCoral(1)">Show Coral 1</button>
  <button onclick="showCoral(2)">Show Coral 2</button>

  <script>
    function showCoral(id) {
      document.getElementById('coral1').style.display = id === 1 ? 'block' : 'none';
      document.getElementById('coral2').style.display = id === 2 ? 'block' : 'none';
    }
  </script>
</body>
</html>
